name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, check existing issues and remove personal information from screenshots and logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Photo2Pet
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Photo2Pet version
      description: Release tag or commit, if known.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11 24H2, Python 3.12, source or packaged release
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error or logs
      description: Remove names, local paths, and other private information before posting.
      render: text
    validations:
      required: false
