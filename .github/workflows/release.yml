name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      EXE_NAME: ${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke test before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: python 桌宠.py --smoke-test

      - name: Build single-file exe
        run: python -m PyInstaller --noconfirm 桌宠.spec

      - name: Pack portable zip
        shell: pwsh
        run: |
          $name = $env:EXE_NAME
          $zip = "dist/$name-portable.zip"
          Compress-Archive -Path "dist/$name.exe", "使用说明.txt", "README.md", "LICENSE", "NOTICE" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Set-Content -Encoding ascii "$zip.sha256"
          Get-ChildItem -LiteralPath dist | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-exe
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
